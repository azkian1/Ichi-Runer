        setupEventListeners() {
          document.getElementById("startButton").addEventListener("click", () => {
            this.assets.unlockAudio();
            this.startGame();
          });

          document.getElementById("restartButton").addEventListener("click", () => {
            this.assets.unlockAudio();
            this.restartGame();
          });

          document.getElementById("endGameButton").addEventListener("click", () => this.endGame());

          window.addEventListener("keydown", this.boundHandlers.keydown);
          window.addEventListener("keyup", this.boundHandlers.keyup);

          // Touch events with passive: false for iOS scroll prevention
          this.canvas.addEventListener("touchstart", this.boundHandlers.touchstart, { passive: false });
          this.canvas.addEventListener("touchmove", this.boundHandlers.touchmove, { passive: false });
          this.canvas.addEventListener("touchend", this.boundHandlers.touchend, { passive: false });

          this.canvas.addEventListener("mousedown", this.boundHandlers.mousedown);
          this.canvas.addEventListener("mouseup", this.boundHandlers.mouseup);

          // Standalone local play
          
        }

        handleKeyDown(e) {
          this.assets.unlockAudio();
          if (this.state !== "playing") return;

          const key = e.key.toLowerCase();

          switch (key) {
            case "a":
            case "arrowleft":
              this.input.left = true;
              e.preventDefault();
              break;
            case "d":
            case "arrowright":
              this.input.right = true;
              e.preventDefault();
              break;
            case "w":
            case "s":
            case " ":
              if (!this.input.attack) {
                this.input.attack = true;
                e.preventDefault();
              }
              break;
          }
        }

        handleKeyUp(e) {
          const key = e.key.toLowerCase();

          switch (key) {
            case "a":
            case "arrowleft":
              this.input.left = false;
              break;
            case "d":
            case "arrowright":
              this.input.right = false;
              break;
            case "w":
            case "s":
            case " ":
              this.input.attack = false;
              break;
          }
        }

        handleTouchStart(e) {
          e.preventDefault();
          this.assets.unlockAudio();

          if (this.state !== "playing") return;

          const touch = e.touches[0];
          const rect = this.canvas.getBoundingClientRect();
          const x = (touch.clientX - rect.left) * (this.canvas.width / rect.width);
          const y = (touch.clientY - rect.top) * (this.canvas.height / rect.height);

          this.updateTouchControls(x, y);
        }

        handleTouchMove(e) {
          e.preventDefault();
          if (this.state !== "playing") return;

          const touch = e.touches[0];
          const rect = this.canvas.getBoundingClientRect();
          const x = (touch.clientX - rect.left) * (this.canvas.width / rect.width);
          const y = (touch.clientY - rect.top) * (this.canvas.height / rect.height);

          this.updateTouchControls(x, y);
        }

        handleTouchEnd(e) {
          e.preventDefault();
          this.touchControls.leftPressed = false;
          this.touchControls.rightPressed = false;
          this.touchControls.attackPressed = false;
          this.input.left = false;
          this.input.right = false;
          this.input.attack = false;
        }

        handleMouseDown(e) {
          this.assets.unlockAudio();
          if (this.state === "playing" && e.button === 0) {
            this.input.attack = true;
          }
        }

        handleMouseUp(e) {
          if (e.button === 0) {
            this.input.attack = false;
          }
        }

        updateTouchControls(x, y) {
          const bottomY = this.canvas.height - 60;
          const controlY = this.canvas.height - 10;

          this.touchControls.leftPressed = false;
          this.touchControls.rightPressed = false;
          this.touchControls.attackPressed = false;
          this.input.left = false;
          this.input.right = false;

          if (x >= 10 && x <= 60 && y >= bottomY && y <= controlY) {
            this.touchControls.leftPressed = true;
            this.input.left = true;
          }

          if (x >= this.canvas.width - 60 && x <= this.canvas.width - 10 && y >= bottomY && y <= controlY) {
            this.touchControls.rightPressed = true;
            this.input.right = true;
          }

          const centerX = this.canvas.width / 2;
          const centerY = this.canvas.height - 35;
          const distance = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);

          if (distance <= 25) {
            this.touchControls.attackPressed = true;
            this.input.attack = true;
          }
        }

        startMusic() {
          if (!this.musicStarted) {
            this.assets.playMusic("bgMusic");
            this.musicStarted = true;
          }
        }

        stopMusic() {
          this.assets.stopMusic("bgMusic");
          this.musicStarted = false;
        }

        startGame() {
          this.startScreen.classList.remove("active");
          this.state = "playing";
          this.initGame();

          

          this.isRunning = true;
          this.lastTime = 0;
          this.animationFrameId = requestAnimationFrame((timestamp) => this.gameLoop(timestamp));
        }

        initGame() {
          // Reset game state
          this.score = 0;
          this.distance = 0;
          this.enemiesKilled = 0;
          this.multiplier = 1;
          this.consecutiveHits = 0;
          this.gameSpeed = CONFIG.game.baseSpeed;
          this.baseSpeed = CONFIG.game.baseSpeed;
          this.difficultyFactor = 1;
          this.spawnTimer = 0;
          this.spawnInterval = CONFIG.game.spawnIntervalMax;
          this.boss = null;
          this.bossMode = false;
          this.nextBossDistance = CONFIG.game.bossInterval;
          this.musicStarted = false;
          this.bossesDefeated = 0;

          // Clear boss powerup timers
          if (this.bossPowerUpTimers) {
            this.bossPowerUpTimers.forEach(id => clearTimeout(id));
          }
          this.bossPowerUpTimers = [];

          // Reset input state
          this.input.left = false;
          this.input.right = false;
          this.input.attack = false;

          // Release all pooled objects
          this.obstacles.forEach(o => this.obstaclePool.release(o));
          this.collectibles.forEach(c => this.collectiblePool.release(c));
          this.attackWaves.forEach(w => this.attackWavePool.release(w));
          this.particles.forEach(p => this.particlePool.release(p));
          this.floatingTexts.forEach(t => this.floatingTextPool.release(t));

          this.obstacles = [];
          this.collectibles = [];
          this.attackWaves = [];
          this.particles = [];
          this.floatingTexts = [];

          // Initialize player
          this.player.init(this.canvas.width / 2, this.canvas.height * CONFIG.player.startY, this.assets);

          // Initialize background
          this.background = new Background(this.canvas, this.assets.getImage("grass"));
        }

        restartGame() {
          this.stopMusic();
          this.gameOverScreen.classList.remove("active");
          this.victoryScreen.classList.remove("active");

          // Cancel any existing animation frame
          if (this.animationFrameId) {
            cancelAnimationFrame(this.animationFrameId);
          }

          this.state = "playing";
          this.initGame();
          this.isRunning = true;
          this.lastTime = 0;
          this.animationFrameId = requestAnimationFrame((timestamp) => this.gameLoop(timestamp));
        }

        endGame() {
          this.victoryScreen.classList.remove("active");
          this.stopMusic();
          this.isRunning = false;

            this.startScreen.classList.add("active");
            this.state = "menu";
        }

        gameLoop(timestamp) {
          if (!this.isRunning || this.state !== "playing") {
            return;
          }

          if (!this.lastTime) this.lastTime = timestamp;
          this.deltaTime = Math.min(2, (timestamp - this.lastTime) / 16.67);
          this.lastTime = timestamp;
          this.timestamp = timestamp;

          this.update();
          this.render();

          this.animationFrameId = requestAnimationFrame((t) => this.gameLoop(t));
        }

        update() {
          // Check for music trigger
          const distanceToBoss = this.nextBossDistance - this.distance;
          if (distanceToBoss <= CONFIG.game.musicTriggerDistance && distanceToBoss > 0 && !this.musicStarted) {
            this.startMusic();
          }

          // Check for boss spawn
          if (this.distance >= this.nextBossDistance && !this.bossMode && !this.boss) {
            this.spawnBoss();
          }

          if (!this.bossMode) {
            this.difficultyFactor = 1 + this.distance / CONFIG.game.difficultyScale;
            this.spawnInterval = Math.max(
              CONFIG.game.spawnIntervalMin,
              CONFIG.game.spawnIntervalMax - this.distance / (CONFIG.game.difficultyScale / 26.67)
            );
            this.gameSpeed = Math.min(CONFIG.game.maxSpeed, this.baseSpeed + this.distance / CONFIG.game.speedScale);
          }

          this.distance += (this.gameSpeed * this.deltaTime) / 60;
          this.score += (CONFIG.scoring.timeBonus * this.gameSpeed * this.deltaTime) / 60;

          this.player.update(this.deltaTime, this.input, this.canvas.width);

          // Handle attack
          if (this.input.attack && this.player.attack()) {
            const wave = this.attackWavePool.get();
            wave.init(this.player.x, this.player.y - 15, this.player.attackRange, this.assets);
            this.attackWaves.push(wave);
            this.assets.playSound("swordSwing");

            
          }
          this.input.attack = false;

          this.background.update(this.deltaTime, this.gameSpeed, this.timestamp);

          // Update boss
          if (this.boss) {
            this.boss.update(this.deltaTime, this.gameSpeed, this.player.x, this.timestamp, this.canvas.width);

            if (this.boss.canShootProjectile()) {
              const ghost = this.obstaclePool.get();
              ghost.init(this.boss.x, this.boss.y + 50, "ghost", this.assets);
              ghost.vy = CONFIG.boss.projectileSpeed;
              this.obstacles.push(ghost);
            }

            if (!this.boss.active) {
              this.boss = null;
              this.bossMode = false;
              this.nextBossDistance += CONFIG.game.bossInterval;
              this.musicStarted = false;
              this.stopMusic();
              // Increase difficulty after boss retreats
              this.bossesDefeated++;
            }

            // Check attack waves hitting boss
            for (let i = this.attackWaves.length - 1; i >= 0; i--) {
              const wave = this.attackWaves[i];
              if (this.boss && wave.checkCollision(this.boss)) {
                // Remove wave after hitting boss
                this.attackWavePool.release(wave);
                this.attackWaves.splice(i, 1);

                if (this.boss.takeDamage()) {
                  this.victory();
                  return;
                }
                this.score += CONFIG.scoring.bossHitPoints * this.multiplier;
                this.createParticles(this.boss.x, this.boss.y, 20);
                this.assets.playSound("ghostDie");
              }
            }
          }

          if (!this.bossMode) {
            this.spawnObjects();
          }

          // Update obstacles
          for (let i = this.obstacles.length - 1; i >= 0; i--) {
            const obstacle = this.obstacles[i];
            obstacle.update(this.deltaTime, this.gameSpeed, this.canvas.width);

            if (obstacle.isOffScreen(this.canvas.height)) {
              this.obstaclePool.release(obstacle);
              this.obstacles.splice(i, 1);
            } else if (obstacle.checkCollision(this.player) && this.player.takeDamage()) {
              this.assets.playSound("loseLife");
              this.consecutiveHits = 0;
              this.multiplier = 1;
              this.obstaclePool.release(obstacle);
              this.obstacles.splice(i, 1);

              if (this.player.lives <= 0) {
                this.gameOver();
                return;
              }
            }
          }

          // Update collectibles
          for (let i = this.collectibles.length - 1; i >= 0; i--) {
            const collectible = this.collectibles[i];
            collectible.update(this.deltaTime, this.gameSpeed, this.timestamp);

            if (collectible.isOffScreen(this.canvas.height)) {
              this.collectiblePool.release(collectible);
              this.collectibles.splice(i, 1);
            } else if (collectible.checkCollision(this.player)) {
              this.handleCollectiblePickup(collectible);
              this.collectiblePool.release(collectible);
              this.collectibles.splice(i, 1);
            }
          }

          // Update attack waves
          for (let i = this.attackWaves.length - 1; i >= 0; i--) {
            const wave = this.attackWaves[i];
            wave.update(this.deltaTime);

            if (!wave.active || wave.y < -wave.height) {
              this.attackWavePool.release(wave);
              this.attackWaves.splice(i, 1);
              continue;
            }

            // Check wave hitting obstacles
            for (let j = this.obstacles.length - 1; j >= 0; j--) {
              const obstacle = this.obstacles[j];
              if (wave.checkCollision(obstacle) && obstacle.destructible) {
                this.handleObstacleDestruction(obstacle);
                this.obstaclePool.release(obstacle);
                this.obstacles.splice(j, 1);
                this.createParticles(obstacle.x, obstacle.y, 10);
                this.enemiesKilled++;
              }
            }

            // Check wave hitting butterflies (removed damage to player - was a bug)
            for (let j = this.collectibles.length - 1; j >= 0; j--) {
              const collectible = this.collectibles[j];
              if (collectible.type === "butterfly" && wave.checkCollision(collectible)) {
                // Just destroy the butterfly, no damage to player
                this.collectiblePool.release(collectible);
                this.collectibles.splice(j, 1);
              }
            }
          }

          // Update particles
          for (let i = this.particles.length - 1; i >= 0; i--) {
            if (!this.particles[i].update(this.deltaTime)) {
              this.particlePool.release(this.particles[i]);
              this.particles.splice(i, 1);
            }
          }

          // Update floating texts
          for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            if (!this.floatingTexts[i].update(this.deltaTime)) {
              this.floatingTextPool.release(this.floatingTexts[i]);
              this.floatingTexts.splice(i, 1);
            }
          }
        }

        spawnBoss() {
          this.bossMode = true;
          this.boss = new Boss();
          this.boss.init(this.canvas.width / 2, CONFIG.boss.yPosition, this.assets);

          // Clear obstacles
          this.obstacles.forEach(o => this.obstaclePool.release(o));
          this.obstacles = [];

          this.spawnBossPowerUps();
        }

        spawnBossPowerUps() {
          const powerUpCount = 3;
          const spawnPowerUp = (index) => {
            if (this.bossMode && this.state === "playing") {
              // Check if range is maxed
              const maxRange = this.canvas.height * CONFIG.player.startY;
              const rangeMaxed = this.player.attackRange >= maxRange;

              // Spawn range or speed powerup based on max range
              const powerUpType = rangeMaxed ? "speedPowerUp" : "rangePowerUp";

              const x = this.canvas.width * 0.2 + Math.random() * this.canvas.width * 0.6;
              const powerUp = this.collectiblePool.get();
              powerUp.init(x, -50, powerUpType, this.assets);
              this.collectibles.push(powerUp);
            }
          };

          for (let i = 0; i < powerUpCount; i++) {
            const timerId = setTimeout(() => spawnPowerUp(i), i * 5000);
            this.bossPowerUpTimers.push(timerId);
          }
        }

        spawnObjects() {
          this.spawnTimer -= this.deltaTime;

          if (this.spawnTimer <= 0) {
            const safeMinX = this.canvas.width * 0.1;
            const safeMaxX = this.canvas.width * 0.9;

            // Obstacle type distribution changes based on bosses defeated
            // More pits and ghosts, fewer barricades as difficulty increases
            const roll = Math.random();
            let obstacleType;

            // Base: 33% pit, 33% barricade, 33% ghost
            // After each boss: +10% pit, -5% barricade, +5% ghost (up to limits)
            const pitChance = Math.min(0.6, 0.33 + this.bossesDefeated * 0.1);
            const barricadeChance = Math.max(0.1, 0.33 - this.bossesDefeated * 0.05);

            if (roll < pitChance) {
              obstacleType = "pit";
            } else if (roll < pitChance + barricadeChance) {
              obstacleType = "barricade";
            } else {
              obstacleType = "ghost";
            }

            const x = safeMinX + Math.random() * (safeMaxX - safeMinX);

            const obstacle = this.obstaclePool.get();
            obstacle.init(x, -50, obstacleType, this.assets);
            if (obstacleType === "ghost") {
              obstacle.vx *= this.difficultyFactor;
              obstacle.vy *= this.difficultyFactor;
            }
            this.obstacles.push(obstacle);

            // Power-ups
            if (Math.random() < 0.1) {
              const powerUpRoll = Math.random();
              let powerUpType;

              // Check if range is maxed (can reach top of screen from player position)
              const maxRange = this.canvas.height * CONFIG.player.startY;
              const rangeMaxed = this.player.attackRange >= maxRange;

              if (powerUpRoll < 0.5) powerUpType = "speedPowerUp";
              else if (powerUpRoll < 0.58) powerUpType = "shieldPowerUp";
              else if (powerUpRoll < 0.66) powerUpType = "life";
              else if (powerUpRoll < 0.83) {
                // Don't spawn range powerup if range is maxed
                powerUpType = rangeMaxed ? "speedPowerUp" : "rangePowerUp";
              }
              else powerUpType = "cooldownPowerUp";

              const powerX = safeMinX + Math.random() * (safeMaxX - safeMinX);
              const powerUp = this.collectiblePool.get();
              powerUp.init(powerX, -50, powerUpType, this.assets);
              this.collectibles.push(powerUp);
            }

            // Butterflies
            if (Math.random() < 0.1) {
              const butterflyX = safeMinX + Math.random() * (safeMaxX - safeMinX);
              const butterfly = this.collectiblePool.get();
              butterfly.init(butterflyX, -50, "butterfly", this.assets);
              this.collectibles.push(butterfly);
            }

            // Sushi
            if (Math.random() < 0.375) {
              const sushiX = safeMinX + Math.random() * (safeMaxX - safeMinX);
              const sushi = this.collectiblePool.get();
              sushi.init(sushiX, -50, "sushi", this.assets);
              this.collectibles.push(sushi);
            }

            this.spawnTimer = this.spawnInterval;
          }
        }

        handleCollectiblePickup(collectible) {
          let floatText = null;

          switch (collectible.type) {
            case "sushi":
              this.score += CONFIG.scoring.sushiPoints;
              this.assets.playSound("collectBonus");
              floatText = "+5";
              break;

            case "speedPowerUp":
              this.player.activateSpeed();
              this.assets.playSound("collectBonus");
              floatText = "+SPEED";
              break;

            case "shieldPowerUp":
              this.player.activateShield();
              this.assets.playSound("collectBonus");
              floatText = "+SHIELD";
              break;

            case "rangePowerUp":
              this.player.increaseRange();
              this.assets.playSound("collectBonus");
              floatText = "+RANGE";
              break;

            case "cooldownPowerUp":
              this.player.reduceCooldown();
              this.assets.playSound("collectBonus");
              floatText = "+COOLDOWN";
              break;

            case "life":
              if (this.player.lives < CONFIG.game.initialLives) {
                this.player.lives++;
                this.assets.playSound("collectBonus");
                floatText = "+LIFE";
              }
              break;

            case "butterfly":
              this.score += 100;
              this.assets.playSound("collectBonus");
              floatText = "+100";
              break;
          }

          if (floatText) {
            this.createFloatingText(collectible.x, collectible.y, floatText);
          }
          this.createParticles(collectible.x, collectible.y, 5);
        }

        handleObstacleDestruction(obstacle) {
          this.consecutiveHits++;
          this.multiplier = Math.min(
            CONFIG.scoring.maxMultiplier,
            1 + Math.floor(this.consecutiveHits / CONFIG.scoring.multiplierThreshold)
          );

          let points = 0;
          let sound = null;

          if (obstacle.type === "barricade") {
            points = CONFIG.scoring.barricadePoints;
            sound = "barricadeBreak";
          } else if (obstacle.type === "ghost") {
            points = CONFIG.scoring.ghostPoints;
            sound = "ghostDie";
          }

          this.score += points * this.multiplier;

          if (sound) {
            this.assets.playSound(sound);
          }
        }

        createParticles(x, y, count) {
          for (let i = 0; i < count; i++) {
            const particle = this.particlePool.get();
            particle.init(x, y);
            this.particles.push(particle);
          }
        }

        createFloatingText(x, y, text) {
          const floatText = this.floatingTextPool.get();
          floatText.init(x, y, text);
          this.floatingTexts.push(floatText);
        }

        render() {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

          this.background.render(this.ctx);

          if (this.boss) {
            this.boss.render(this.ctx, this.timestamp);
          }

          // Render in layers (single pass with sorting by type)
          // Layer 1: Pits and barricades
          for (const o of this.obstacles) {
            if (o.type === "pit" || o.type === "barricade") {
              o.render(this.ctx);
            }
          }

          // Layer 2: Sushi
          for (const c of this.collectibles) {
            if (c.type === "sushi") {
              c.render(this.ctx);
            }
          }

          // Layer 3: Other collectibles (not butterflies)
          for (const c of this.collectibles) {
            if (c.type !== "sushi" && c.type !== "butterfly") {
              c.render(this.ctx);
            }
          }

          // Layer 4: Butterflies
          for (const c of this.collectibles) {
            if (c.type === "butterfly") {
              c.render(this.ctx);
            }
          }

          // Layer 5: Ghosts
          for (const o of this.obstacles) {
            if (o.type === "ghost") {
              o.render(this.ctx);
            }
          }

          // Layer 6: Attack waves
          for (const w of this.attackWaves) {
            w.render(this.ctx);
          }

          // Layer 7: Particles
          for (const p of this.particles) {
            p.render(this.ctx);
          }

          // Layer 8: Floating texts
          for (const t of this.floatingTexts) {
            t.render(this.ctx);
          }

          // Layer 9: Player
          this.player.render(this.ctx);

          this.renderHUD();
          this.renderMobileControls();
        }

        renderHUD() {
          this.ctx.fillStyle = "#fff";
          this.ctx.font = "bold 20px Arial";
          this.ctx.textAlign = "left";
          this.ctx.fillText(`Score: ${Math.floor(this.score)}`, 10, 30);

          const distanceToDemon = this.nextBossDistance - this.distance;
          this.ctx.fillStyle = distanceToDemon < 50 ? "#ff6666" : "#ffffff";
          this.ctx.font = "bold 16px Arial";
          this.ctx.fillText(`Demon in: ${Math.floor(Math.max(0, distanceToDemon))}m`, 10, 110);

          // Lives
          for (let i = 0; i < CONFIG.game.initialLives; i++) {
            const x = this.canvas.width - 55 - i * 25;
            this.renderHeart(x, 30, i < this.player.lives);
          }

          // Attack cooldown bar (adaptive width)
          const barWidth = Math.min(100, this.canvas.width * 0.25);
          this.ctx.strokeStyle = "#fff";
          this.ctx.lineWidth = 2;
          this.ctx.strokeRect(10, 50, barWidth, 10);

          const cooldownFill = Math.max(0, 1 - this.player.attackCooldown / this.player.attackCooldownMax);
          this.ctx.fillStyle = "#ff4444";
          this.ctx.fillRect(10, 50, barWidth * cooldownFill, 10);

          // Shield bar
          if (this.player.shield) {
            this.ctx.strokeStyle = "#fff";
            this.ctx.strokeRect(10, 70, barWidth, 10);

            const shieldFill = Math.max(0, this.player.shieldTimer / CONFIG.powerUps.shieldDuration);
            this.ctx.fillStyle = "#00ffff";
            this.ctx.fillRect(10, 70, barWidth * shieldFill, 10);
          }

          // Multiplier
          if (this.multiplier > 1) {
            this.ctx.fillStyle = "#ffff00";
            this.ctx.font = "bold 16px Arial";
            this.ctx.fillText(`x${this.multiplier}`, 10, 95);
          }
        }

        renderHeart(x, y, filled, size = 20) {
          const scale = size / 20;
          this.ctx.save();
          this.ctx.translate(x, y);
          this.ctx.scale(scale, scale);

          this.ctx.beginPath();
          this.ctx.moveTo(0, 5);
          this.ctx.bezierCurveTo(0, 0, -10, -5, -10, -10);
          this.ctx.bezierCurveTo(-10, -15, 0, -15, 0, -10);
          this.ctx.bezierCurveTo(0, -15, 10, -15, 10, -10);
          this.ctx.bezierCurveTo(10, -5, 0, 0, 0, 5);
          this.ctx.closePath();

          if (filled) {
            this.ctx.fillStyle = "#ff0000";
            this.ctx.fill();
          } else {
            this.ctx.strokeStyle = "#ffffff";
            this.ctx.lineWidth = 2 / scale;
            this.ctx.stroke();
          }

          this.ctx.restore();
        }

        renderMobileControls() {
          // Only show on touch devices
          if (!this.isTouchDevice) return;

          this.ctx.fillStyle = `rgba(255, 255, 255, ${this.touchControls.leftPressed ? 1.0 : 0.5})`;
          this.ctx.beginPath();
          this.ctx.moveTo(40, this.canvas.height - 50);
          this.ctx.lineTo(40, this.canvas.height - 10);
          this.ctx.lineTo(10, this.canvas.height - 30);
          this.ctx.closePath();
          this.ctx.fill();

          this.ctx.fillStyle = `rgba(255, 255, 255, ${this.touchControls.rightPressed ? 1.0 : 0.5})`;
          this.ctx.beginPath();
          this.ctx.moveTo(this.canvas.width - 40, this.canvas.height - 50);
          this.ctx.lineTo(this.canvas.width - 40, this.canvas.height - 10);
          this.ctx.lineTo(this.canvas.width - 10, this.canvas.height - 30);
          this.ctx.closePath();
          this.ctx.fill();

          this.ctx.fillStyle = `rgba(255, 255, 255, ${this.touchControls.attackPressed ? 1.0 : 0.5})`;
          this.ctx.beginPath();
          this.ctx.arc(this.canvas.width / 2, this.canvas.height - 35, 25, 0, Math.PI * 2);
          this.ctx.fill();
        }

        victory() {
          this.state = "victory";
          this.isRunning = false;
          this.stopMusic();

          this.score += CONFIG.scoring.bossDefeatPoints;
          this.enemiesKilled++;

          if (this.score > this.highScore) {
            this.highScore = Math.floor(this.score);
            localStorage.setItem("ninjaHighScore", this.highScore.toString());
          }

          document.getElementById("victoryScore").textContent = Math.floor(this.score);
          document.getElementById("victoryDistance").textContent = Math.floor(this.distance);
          document.getElementById("enemiesDefeated").textContent = this.enemiesKilled;

          this.victoryScreen.classList.add("active");
        }

        gameOver() {
          this.state = "gameOver";
          this.isRunning = false;
          this.stopMusic();

            if (this.score > this.highScore) {
              this.highScore = Math.floor(this.score);
              localStorage.setItem("ninjaHighScore", this.highScore.toString());
            }

            document.getElementById("finalScore").textContent = Math.floor(this.score);
            document.getElementById("finalDistance").textContent = Math.floor(this.distance);
            document.getElementById("highScore").textContent = this.highScore;

            this.gameOverScreen.classList.add("active");
        }

        destroy() {
          // Clean up event listeners
          window.removeEventListener("resize", this.boundHandlers.resize);
          window.removeEventListener("keydown", this.boundHandlers.keydown);
          window.removeEventListener("keyup", this.boundHandlers.keyup);

          // iOS Safari visualViewport
          if (window.visualViewport) {
            window.visualViewport.removeEventListener("resize", this.boundHandlers.resize);
          }

          this.canvas.removeEventListener("touchstart", this.boundHandlers.touchstart);
          this.canvas.removeEventListener("touchmove", this.boundHandlers.touchmove);
          this.canvas.removeEventListener("touchend", this.boundHandlers.touchend);
          this.canvas.removeEventListener("mousedown", this.boundHandlers.mousedown);
          this.canvas.removeEventListener("mouseup", this.boundHandlers.mouseup);

          // Cancel animation frame
          if (this.animationFrameId) {
            cancelAnimationFrame(this.animationFrameId);
          }

          // Clear boss powerup timers
          this.bossPowerUpTimers.forEach(id => clearTimeout(id));
          this.bossPowerUpTimers = [];

          // Clean up audio
          this.assets.destroy();

          // Release all pooled objects
          this.obstaclePool.releaseAll();
          this.collectiblePool.releaseAll();
          this.attackWavePool.releaseAll();
          this.particlePool.releaseAll();
          this.floatingTextPool.releaseAll();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const game = new Game();
      });
    </script>
  </body>
</html>
